name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - codex/stb-01-global-capture-windows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation
      SUPABASE_SECRET_KEY: sb_secret_ci_validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned static SQL parser on CI runner
        run: python -m pip install pglast==8.7
      - name: Validate documentary SQL and integration fixture syntax only
        run: python scripts/validate-document-retention-sql.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  supabase-preview-integration:
    name: STB-01 isolated Supabase Preview
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/stb-01-')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STB_GIT_BRANCH: ${{ github.head_ref }}
      STB_PR_NUMBER: ${{ github.event.pull_request.number }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Preview and run transactional integration assertions
        run: node scripts/ci/indicator-global-preview.mjs
      - name: Verify six races in independent authenticated Preview sessions
        run: node scripts/ci/indicator-concurrency-preview.mjs
      - name: Verify deterministic cleanup of committed Preview fixtures
        if: always()
        run: node scripts/ci/indicator-concurrency-preview.mjs --cleanup

  document-preview-integration:
    name: STB-02 isolated Supabase Preview
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/stb-02-document-retention' && vars.IQ_FIX_01_SQL_ACCEPTANCE == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STB_GIT_BRANCH: ${{ github.head_ref }}
      STB_PR_NUMBER: ${{ github.event.pull_request.number }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify only document retention assertions in the exact PR Preview
        run: node scripts/ci/document-retention-preview.mjs
